# Reusable SBOM-generation workflow.
#
# Generates CycloneDX 1.6 + SPDX 3.0.1 SBOMs for the requested artifact:
#   - source / npm: cdxgen against the pnpm workspace (via pnpm sbom:generate)
#   - docker:       syft scan of the published image
#   - macos:        syft scan of the .app bundle / DMG
#
# Outputs SBOM file paths so the calling release workflow can chain
# actions/attest-build-provenance@v2 and actions/attest-sbom@v2 to reach
# SLSA Build Level 3 via GitHub-native primitives — no key custody added.
#
# See docs/security/audit-2026-04.md and the companion plan
# docs/plans/2026-04-25-001-feat-sbom-zero-trust-solo-audit-plan.md.

name: SBOM and Attest (Reusable)

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: What kind of artifact this run is generating an SBOM for
        required: true
        default: source
        type: choice
        options:
          - source
          - npm
          - docker
          - macos
      ref:
        description: Ref, tag, or SHA to scan
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      artifact_type:
        description: source | npm | docker | macos
        required: true
        type: string
      ref:
        description: Ref, tag, or SHA to scan (defaults to the calling workflow's ref)
        required: false
        default: ""
        type: string
      artifact_path:
        description: Path to a built artifact (Docker image ref, dmg path, tarball path) — required for non-source scans
        required: false
        default: ""
        type: string
      upload_artifact:
        description: Whether to upload the SBOM as a workflow artifact
        required: false
        default: true
        type: boolean
    outputs:
      sbom_cdx_path:
        description: Path inside the runner workspace to the CycloneDX SBOM
        value: ${{ jobs.generate.outputs.sbom_cdx_path }}
      sbom_spdx_path:
        description: Path inside the runner workspace to the SPDX SBOM
        value: ${{ jobs.generate.outputs.sbom_spdx_path }}

permissions:
  contents: read

concurrency:
  group: sbom-and-attest-${{ github.workflow }}-${{ inputs.artifact_type }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate SBOM (${{ inputs.artifact_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sbom_cdx_path: ${{ steps.locate.outputs.sbom_cdx_path }}
      sbom_spdx_path: ${{ steps.locate.outputs.sbom_spdx_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Generate source SBOMs (CycloneDX + SPDX)
        if: inputs.artifact_type == 'source' || inputs.artifact_type == 'npm'
        run: pnpm sbom:generate

      - name: Validate Docker artifact_path
        if: inputs.artifact_type == 'docker'
        env:
          IMAGE_REF: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "::error::artifact_path must be supplied for artifact_type=docker"
            exit 1
          fi
          mkdir -p bom

      - name: Scan built Docker image with syft (CycloneDX)
        if: inputs.artifact_type == 'docker'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.artifact_path }}
          format: cyclonedx-json
          output-file: bom/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan built Docker image with syft (SPDX)
        if: inputs.artifact_type == 'docker'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.artifact_path }}
          format: spdx-json
          output-file: bom/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate macOS artifact_path
        if: inputs.artifact_type == 'macos'
        env:
          APP_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          if [ -z "${APP_PATH}" ]; then
            echo "::error::artifact_path must be supplied for artifact_type=macos"
            exit 1
          fi
          if [ ! -e "${APP_PATH}" ]; then
            echo "::error::artifact_path ${APP_PATH} does not exist"
            exit 1
          fi
          mkdir -p bom

      - name: Scan macOS bundle with syft (CycloneDX)
        if: inputs.artifact_type == 'macos'
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.artifact_path }}
          format: cyclonedx-json
          output-file: bom/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan macOS bundle with syft (SPDX)
        if: inputs.artifact_type == 'macos'
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.artifact_path }}
          format: spdx-json
          output-file: bom/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Locate SBOM outputs
        id: locate
        run: |
          set -euo pipefail
          cdx="bom/sbom.cdx.json"
          spdx="bom/sbom.spdx.json"
          test -f "$cdx" || (echo "::error::missing $cdx after generation" && exit 1)
          test -f "$spdx" || (echo "::error::missing $spdx after generation" && exit 1)
          echo "sbom_cdx_path=$cdx" >> "$GITHUB_OUTPUT"
          echo "sbom_spdx_path=$spdx" >> "$GITHUB_OUTPUT"

      - name: Upload SBOMs as workflow artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.artifact_type }}-${{ github.run_id }}
          path: bom/
          if-no-files-found: error
          retention-days: 30
